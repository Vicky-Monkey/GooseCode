  <path d="M28 105c-9-5-15-12-18-19 13 1 23 5 31 11 14-11 35-13 52-5 11-7 16-18 16-32V48c-3-5-4-10-2-16 2-10 11-16 21-15 13 1 21 11 19 22-1 10-10 18-20 18l-1 19c0 12 5 20 8 29 6 19-15 34-57 34-31 0-55-11-55-25 0-4 2-7 6-9Z" fill="url(#goose-feathers)" stroke="#28594D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
